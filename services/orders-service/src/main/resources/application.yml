server:
  port: 8082

spring:
  application:
    name: orders-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/orders_db
    username: admin
    password: secret
  flyway:
    url: jdbc:postgresql://localhost:5432/orders_db
    user: admin
    password: secret
    locations: classpath:db/migration

clients:
  menu-service:
    url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
