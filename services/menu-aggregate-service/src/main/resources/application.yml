server:
  port: 8084

spring:
  application:
    name: menu-aggregate-service

clients:
  menu-service:
    url: http://localhost:8081
  reviews-service:
    url: http://localhost:8083

resilience4j:
  circuitbreaker:
    instances:
      reviewsService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      reviewsService:
        maxAttempts: 2
        waitDuration: 200ms
        ignoreExceptions:
          - ru.fooddelivery.aggregate.exception.DishNotFoundException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers
  health:
    circuitbreakers:
      enabled: true
