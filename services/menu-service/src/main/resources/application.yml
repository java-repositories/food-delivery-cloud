server:
  port: 8081

spring:
  application:
    name: menu-service
  datasource:
    url: jdbc:postgresql://localhost:5432/menu_db
    username: admin
    password: secret
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
