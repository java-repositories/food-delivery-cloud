server:
  port: 8083

spring:
  application:
    name: reviews-service
  datasource:
    url: jdbc:postgresql://localhost:5432/reviews_db
    username: admin
    password: secret
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
