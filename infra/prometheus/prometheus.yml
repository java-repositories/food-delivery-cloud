global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'food-delivery-microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8080' # api-gateway
          - 'host.docker.internal:8081' # menu-service
          - 'host.docker.internal:8082' # orders-service
          - 'host.docker.internal:8083' # reviews-service
          - 'host.docker.internal:8084' # menu-aggregate-service
          - 'host.docker.internal:8085' # dispatcher-service
